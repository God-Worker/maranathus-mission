name: MARANATHUS Mission QA

on:
  push:
    branches:
      - qa/mission-build-ci-20261026-1715
    paths:
      - '.github/workflows/mission-qa.yml'
      - 'app/**'
      - 'package.json'
      - 'package-lock.json'
      - 'next.config.js'
      - 'tsconfig.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mission-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'

      - name: Smoke-test production routes
        shell: bash
        run: |
          set -euo pipefail
          node node_modules/next/dist/bin/next start -p 3210 -H 127.0.0.1 > /tmp/mission-next.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in $(seq 1 30); do
            if curl --fail --silent --max-time 2 http://127.0.0.1:3210/api/health > /dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            cat /tmp/mission-next.log
            exit 1
          fi
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const base = 'http://127.0.0.1:3210';
          const health = await fetch(`${base}/api/health`);
          assert.equal(health.status, 200);
          const data = await health.json();
          assert.equal(data.ok, true);
          assert.equal(data.service, 'maranathus-mission');
          for (const path of ['/', '/about', '/media', '/community', '/store', '/donate', '/news', '/contact']) {
            const response = await fetch(`${base}${path}`);
            assert.equal(response.status, 200, `${path} returned ${response.status}`);
            assert.match(response.headers.get('content-type') ?? '', /text[/]html/i, `${path} should return HTML`);
            const html = await response.text();
            assert.doesNotMatch(html, /maranathus[.]example|000-0000-000000/i, `${path} exposes placeholder contact or bank details`);
            if (path === '/donate' || path === '/contact') {
              assert.match(html, /준비 중/, `${path} should explain that official details are pending`);
            }
            console.log(`PASS ${path}`);
          }
          const missing = await fetch(`${base}/__qa_missing_route__`);
          assert.equal(missing.status, 404, 'unknown route should return 404');
          console.log('PASS unknown route 404');
          NODE
